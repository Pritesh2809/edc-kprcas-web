<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>edckprcas.co.in | Back soon</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#070b1f; --deep:#0e1535; --mist:#eef1ff; --dim:#98a2cf;
  --teal:#2de2c4; --amber:#ffb347; --glass:rgba(255,255,255,.06); --edge:rgba(255,255,255,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:radial-gradient(1200px 700px at 20% 10%,#1a2468 0%,transparent 60%),
             radial-gradient(900px 600px at 85% 90%,#0b4a5a 0%,transparent 60%),var(--ink);
  color:var(--mist);font-family:'Manrope',system-ui,sans-serif;overflow:hidden;
}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.glow{position:fixed;width:46vmax;height:46vmax;border-radius:50%;filter:blur(90px);opacity:.22;pointer-events:none;
  background:radial-gradient(circle,var(--teal),transparent 65%);left:var(--mx,50%);top:var(--my,50%);
  transform:translate(-50%,-50%);transition:left .6s ease-out,top .6s ease-out}
main{position:relative;z-index:2;min-height:100%;display:grid;place-items:center;padding:24px;
  padding-top:max(24px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom))}
.card{width:min(760px,100%);text-align:center;padding:clamp(28px,5vw,56px);border-radius:28px;
  background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 30px 80px rgba(0,0,0,.45);transform:perspective(1000px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
  transition:transform .25s ease-out;animation:enter 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0;transform:perspective(1000px) translateY(30px) scale(.97)}to{opacity:1}}
.gear{width:76px;height:76px;margin:0 auto 22px;display:block}
.gear .big{transform-origin:38px 38px;animation:spin 9s linear infinite}
.gear .small{transform-origin:58px 56px;animation:spin 5s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:clamp(2rem,6vw,3.6rem);line-height:1.08;letter-spacing:-.02em}
.sub{margin:18px auto 0;max-width:46ch;color:var(--dim);font-size:1.05rem;line-height:1.65}
.site{display:inline-block;margin-top:22px;padding:7px 16px;border-radius:99px;border:1px solid var(--edge);
  font-weight:700;font-size:.95rem;color:var(--teal);background:rgba(45,226,196,.07)}
.status{margin-top:34px;text-align:left}
.status-row{display:flex;justify-content:space-between;gap:12px;font-size:.9rem;color:var(--dim);margin-bottom:10px}
.status-row b{color:var(--mist);font-weight:500;transition:opacity .35s}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--teal),var(--amber));
  box-shadow:0 0 18px rgba(45,226,196,.6);transition:width 1.6s cubic-bezier(.2,.8,.2,1)}
.count{display:flex;justify-content:center;gap:clamp(10px,3vw,22px);margin-top:34px}
.unit{min-width:74px;padding:14px 8px;border-radius:16px;background:rgba(0,0,0,.25);border:1px solid var(--edge)}
.unit span{display:block;font-family:'Fraunces',serif;font-size:clamp(1.6rem,5vw,2.3rem);font-variant-numeric:tabular-nums}
.unit small{color:var(--dim);font-size:.78rem}
.cta{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:34px}
.btn{padding:13px 24px;border-radius:14px;font:700 .95rem 'Manrope',sans-serif;text-decoration:none;
  color:var(--ink);background:var(--teal);transition:transform .2s,box-shadow .2s;box-shadow:0 8px 24px rgba(45,226,196,.3)}
.btn.ghost{background:transparent;color:var(--mist);border:1px solid var(--edge);box-shadow:none}
.btn:hover{transform:translateY(-3px)}
.btn:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
footer{margin-top:28px;font-size:.82rem;color:var(--dim)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:480px){.unit{min-width:62px}}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="glow" id="glow" aria-hidden="true"></div>

<main>
  <section class="card" id="card">
    <svg class="gear" viewBox="0 0 80 80" fill="none" aria-hidden="true">
      <g class="big" stroke="#2de2c4" stroke-width="3" stroke-linecap="round">
        <circle cx="38" cy="38" r="12"/>
        <path d="M38 10v8M38 58v8M10 38h8M58 38h8M18.2 18.2l5.6 5.6M52.2 52.2l5.6 5.6M18.2 57.8l5.6-5.6M52.2 23.8l5.6-5.6"/>
      </g>
      <g class="small" stroke="#ffb347" stroke-width="3" stroke-linecap="round">
        <circle cx="58" cy="56" r="6"/>
        <path d="M58 45v4M58 63v4M47 56h4M65 56h4"/>
      </g>
    </svg>

    <h1>We're making the site better for you</h1>
    <p class="sub">Scheduled maintenance is under way. Everything will be back online shortly, faster and easier to use.</p>
    <div class="site">edckprcas.co.in</div>

    <div class="status" role="status" aria-live="polite">
      <div class="status-row"><b id="msg">Backing up content</b><span id="pct">0%</span></div>
      <div class="bar"><div class="fill" id="fill"></div></div>
    </div>

    <div class="count" id="count" aria-label="Time remaining">
      <div class="unit"><span id="d">00</span><small>days</small></div>
      <div class="unit"><span id="h">00</span><small>hours</small></div>
      <div class="unit"><span id="m">00</span><small>minutes</small></div>
      <div class="unit"><span id="s">00</span><small>seconds</small></div>
    </div>

    <div class="cta">
      <a class="btn" href="mailto:edc@kprcas.ac.in?subject=Website%20enquiry">Email us</a>
      <a class="btn ghost" href="javascript:location.reload()">Check again</a>
    </div>
    <footer>&copy; <span id="yr"></span> EDC KPRCAS. Thank you for your patience.</footer>
  </section>
</main>

<script>
/* ---- Settings: edit these ---- */
const BACK_ONLINE = new Date("2026-10-05T10:00:00+05:30"); // expected return time
const PROGRESS = 72;                                         // 0-100
const MESSAGES = ["Backing up content","Updating the server","Polishing the pages","Running final checks"];

/* ---- Constellation canvas ---- */
const cv = document.getElementById('sky'), ctx = cv.getContext('2d');
let W, H, dots = [], mouse = {x:-999,y:-999};
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function size(){
  const r = devicePixelRatio || 1; W = innerWidth; H = innerHeight;
  cv.width = W*r; cv.height = H*r; ctx.setTransform(r,0,0,r,0,0);
  const n = Math.min(110, Math.floor(W*H/14000));
  dots = Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,
    vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,r:Math.random()*1.6+.6,a:Math.random()>.85}));
}
function draw(){
  ctx.clearRect(0,0,W,H);
  for(const p of dots){
    if(!reduce){p.x+=p.vx;p.y+=p.vy;}
    if(p.x<0||p.x>W)p.vx*=-1; if(p.y<0||p.y>H)p.vy*=-1;
    const dx=p.x-mouse.x, dy=p.y-mouse.y, d=Math.hypot(dx,dy);
    if(d<140&&!reduce){p.x+=dx/d*1.4;p.y+=dy/d*1.4;}
  }
  for(let i=0;i<dots.length;i++){
    const a=dots[i];
    for(let j=i+1;j<dots.length;j++){
      const b=dots[j], d=Math.hypot(a.x-b.x,a.y-b.y);
      if(d<130){ctx.strokeStyle=`rgba(45,226,196,${(1-d/130)*.28})`;ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}
    }
    const m=Math.hypot(a.x-mouse.x,a.y-mouse.y);
    if(m<170){ctx.strokeStyle=`rgba(255,179,71,${(1-m/170)*.5})`;
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(mouse.x,mouse.y);ctx.stroke();}
    ctx.fillStyle=a.a?'#ffb347':'#cfd8ff';ctx.beginPath();ctx.arc(a.x,a.y,a.r,0,7);ctx.fill();
  }
  requestAnimationFrame(draw);
}
addEventListener('resize',size); size(); draw();

/* ---- Pointer: glow + card tilt ---- */
const card=document.getElementById('card'), glow=document.getElementById('glow');
function move(x,y){
  mouse.x=x; mouse.y=y;
  glow.style.setProperty('--mx',x+'px'); glow.style.setProperty('--my',y+'px');
  if(!reduce){card.style.setProperty('--ry',((x/W-.5)*6).toFixed(2)+'deg');
              card.style.setProperty('--rx',((.5-y/H)*6).toFixed(2)+'deg');}
}
addEventListener('pointermove',e=>move(e.clientX,e.clientY));
addEventListener('pointerleave',()=>{mouse.x=mouse.y=-999});

/* ---- Progress + rotating status ---- */
const fill=document.getElementById('fill'), pct=document.getElementById('pct'), msg=document.getElementById('msg');
setTimeout(()=>{fill.style.width=PROGRESS+'%';
  let n=0;const t=setInterval(()=>{n++;pct.textContent=Math.min(n,PROGRESS)+'%';if(n>=PROGRESS)clearInterval(t)},18);},500);
let mi=0;setInterval(()=>{msg.style.opacity=0;setTimeout(()=>{mi=(mi+1)%MESSAGES.length;msg.textContent=MESSAGES[mi];msg.style.opacity=1},350)},3200);

/* ---- Countdown ---- */
const pad=n=>String(n).padStart(2,'0');
function tick(){
  let t=Math.max(0,BACK_ONLINE-Date.now())/1000;
  d.textContent=pad(Math.floor(t/86400));h.textContent=pad(Math.floor(t%86400/3600));
  m.textContent=pad(Math.floor(t%3600/60));s.textContent=pad(Math.floor(t%60));
}
tick();setInterval(tick,1000);
document.getElementById('yr').textContent=new Date().getFullYear();
</script>
</body>
</html>
